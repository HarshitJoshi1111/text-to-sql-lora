data:
  url: https://github.com/salesforce/WikiSQL/raw/master/data.tar.bz2   # BSD-3-Clause

prepare:
  example_rows: 3             # rows of the table shown in the prompt (values, spelling, number format)
  max_cell_chars: 40
  valid_size: 500             # questions from WikiSQL dev, validation loss during fine-tuning
  eval_size: 500              # questions from WikiSQL test: the fixed evaluation set for every model
  seed: 0

evaluate:
  max_tokens: 128
  batch_size: 16
  models:                     # zero-shot baselines (no fine-tuning), Qwen2.5 Instruct (Apache-2.0)
    # 4-bit weights: 0.3 / 0.9 GB instead of 1 / 3 GB, so they fit the 8 GB laptop and its disk;
    # fine-tuning on a 4-bit base model with LoRA adapters is QLoRA
    qwen2.5-0.5b: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    qwen2.5-1.5b: mlx-community/Qwen2.5-1.5B-Instruct-4bit

# LoRA fine-tuning with mlx-lm (python -m src.train --run NAME --evaluate)
train:
  defaults:
    batch_size: 2             # 2 questions per step, gradients of 2 steps added up: 4 per update;
    grad_accumulation: 2      # batches of 4 run out of memory on the 8 GB M1
    grad_checkpoint: true     # recompute activations in the backward pass instead of storing them
    iters: 2000               # 4,000 training questions (1,000 updates), about 8 % of the training set
    learning_rate: 5.0e-5     # peak, after a linear warm-up (in updates), then cosine decay to a tenth
    warmup: 50
    num_layers: -1            # adapters in all transformer layers
    rank: 8
    scale: 20.0
    dropout: 0.05
    mask_prompt: true         # loss only on the SQL answer, not on the schema and question
    max_seq_length: 768       # more than 99.9 % of the examples are shorter; the longer ones are left out
    steps_per_eval: 200
    val_batches: 50           # 100 validation questions per evaluation
    save_every: 1000
    seed: 0
  runs:                       # each entry overrides the defaults
    qwen2.5-0.5b-lora:        # main run: 4,000 training questions
      model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    # ablations: the same seed gives the same order of training questions, so a shorter run sees
    # the first part of the questions of a longer one
    qwen2.5-0.5b-lora-1k:     # training-set size: 1,000 and 2,000 questions
      model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      iters: 500
    qwen2.5-0.5b-lora-2k:
      model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      iters: 1000
    qwen2.5-0.5b-lora-2k-r4:  # LoRA rank 4 and 16 (rank 8 above)
      model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      iters: 1000
      rank: 4
    qwen2.5-0.5b-lora-2k-r16:
      model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      iters: 1000
      rank: 16
    qwen2.5-1.5b-lora-2k:     # the larger model with the same 2,000 questions
      model: mlx-community/Qwen2.5-1.5B-Instruct-4bit
      iters: 1000
      dtype: float32          # training loss turned NaN in float16 (as stored, iteration 10) and bfloat16 (iteration 90)
